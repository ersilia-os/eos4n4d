Title: Weighted Gram-Negative Accumulation Prediction
Description: Reports a weighted accumulation score capturing how much compound builds
  up inside Gram-negative bacteria, the bottleneck that stops most antibacterial chemistry
  from working. Köllen and colleagues used the measure inside a generative pipeline,
  scoring proposed structures for likely accumulation before synthesis, and went on
  to make and test compounds that proved potent against Gram-negative organisms. The
  score reflects predicted intracellular concentration, which is a prerequisite for
  activity rather than a measure of it.
