Title: Weighted Gram-Negative Accumulation Prediction
Description: Reports a weighted accumulation score capturing how much compound builds
  up inside Gram-negative bacteria, the bottleneck that stops most antibacterial chemistry
  from working. Köllen and colleagues blend an AutoML model fitted on the Richter
  Escherichia coli accumulation data with TwinBooster, a zero-shot predictor for distant
  chemistry, weighting the two by a molecule's mean Tanimoto similarity to its five
  nearest training compounds. They used the score to triage generated structures before
  synthesis, and what they made was active against E. coli and Staphylococcus aureus.
